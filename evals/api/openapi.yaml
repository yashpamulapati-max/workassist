      type: object
      title: EvaluatorClone
      description: |-
        Payload for cloning an evaluator (typically a system template).

        Creates a new user-owned evaluator with `is_system_managed: false`.
        The cloned evaluator can be customized after creation.
      examples:
        - admins:
            - users:123456789
          description: Team-owned clone with stricter thresholds.
          license: licenses-aaip:00581fef-acde-4f9a-8a25-e05f529e8cb5
          name: RAG Quality Judge (Team Copy)
          users:
            - accounts:qa-team
    EvaluatorExecutionConfig:
      properties:
        modelId:
          anyOf:
            - type: string
            - type: "null"
          title: Modelid
          description: The LLM model to use for LLM-as-a-Judge evaluations (e.g., 'gpt-4',
            'claude-3-opus')
        timeoutSeconds:
          type: integer
          minimum: 1
          title: Timeoutseconds
          description: Maximum time allowed for evaluating a single record
          default: 300
        retryConfig:
          anyOf:
            - $ref: "#/components/schemas/RetryConfig"
            - type: "null"
          description: Retry configuration for handling transient failures
        searchType:
          anyOf:
            - type: string
              pattern: ^(hybrid|semantic|fulltext)$
            - type: "null"
          title: Searchtype
          description: "Type of search for KB retrieval: 'hybrid', 'semantic', or
            'fulltext'. Default is 'hybrid' (recommended for most use cases)"
          default: hybrid
        topK:
          anyOf:
            - type: integer
              maximum: 50
              minimum: 1
            - type: "null"
          title: Topk
          description: Number of chunks to retrieve from KB Service. Maximum is 50.
            Default is 10.
          default: 10
        scoreThreshold:
          anyOf:
            - type: number
              maximum: 1
              minimum: 0
            - type: "null"
          title: Scorethreshold
          description: Minimum score threshold for retrieved chunks (0.0-1.0). If set,
            only chunks with score >= threshold are returned.
        searchMode:
          anyOf:
            - type: string
              pattern: ^(all|any)$
            - type: "null"
          title: Searchmode
          description: "Search mode for fulltext search: 'all' (AND logic) or 'any' (OR
            logic). Note: Currently not supported by KB Service and is ignored."
        filter:
          anyOf:
            - type: string
            - type: "null"
          title: Filter
          description: "FIQL filter expression to limit search scope based on metadata.
            Example: tags=in=(product:tekla-structures;version:2025)"
      type: object
      title: EvaluatorExecutionConfig
      description: >-
        Configuration for evaluator execution behavior.


        .. deprecated::
            This class is deprecated. Use job-level execution config
            (``EvaluateAgentExecutionConfig`` or ``EvaluateRetrievalExecutionConfig``)
            passed at job creation time instead. Retained for backward compatibility
            and as the default base when no job-level config is provided.

        Includes model selection, timeouts, retry logic, and retrieval
        parameters.
