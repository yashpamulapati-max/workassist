    Evaluator:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: "[Primary Key] The unique identifier for the evaluator"
        name:
          type: string
          title: Name
          description: A human-readable name (e.g., 'RAG Quality Judge')
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: A short description of what this evaluator measures
        isSystemManaged:
          type: boolean
          title: Issystemmanaged
          description: If true, this is a Trimble-managed template evaluator (read-only,
            cannot be used for jobs directly). If false, this is a user-owned
            evaluator that can be used for job creation.
        clonedFromTemplate:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Clonedfromtemplate
          description: (Optional) If this evaluator was cloned, the id of the source
            template evaluator
        prompt:
          anyOf:
            - type: string
            - type: "null"
          title: Prompt
          description: The LLM-as-a-Judge prompt
        outputMetrics:
          items:
            $ref: "#/components/schemas/OutputMetric"
          type: array
          title: Outputmetrics
          description: "[Required] A list of all metrics this evaluator produces"
        admins:
          anyOf:
            - items:
                type: string
                pattern: ^trimble-employee:(true|false)$|^trimble-automation:(true|false)$|^(users|applications|accounts):(\*|[\w_.-]+)$
                description: Actor claims
              type: array
            - type: "null"
          title: Admins
          description: 'Actors that can manage this evaluator (update config, delete,
            manage permissions, create jobs). For system evaluators:
            ["accounts:trimble-placeholder-of-employees"]. Uses same claim
            syntax as agents.yaml: "users:123456789", "accounts:qa-team",
            "applications:*"'
        users:
          anyOf:
            - items:
                type: string
                pattern: ^trimble-employee:(true|false)$|^trimble-automation:(true|false)$|^(users|applications|accounts):(\*|[\w_.-]+)$
                description: Actor claims
              type: array
            - type: "null"
          title: Users
          description: "Actors that can create and view jobs with this evaluator. Note:
            For system evaluators, users must clone them first before creating
            jobs. Uses same claim syntax as agents.yaml."
        executionConfig:
          anyOf:
            - $ref: "#/components/schemas/EvaluatorExecutionConfig"
            - type: "null"
          description: (Optional) Configuration for execution behavior (model, timeout,
            retry)
        license:
          anyOf:
            - type: string
              pattern: ^(licenses-aaip):(\*|[\w_.-]+)$
              description: CURIE format for license identifier
            - type: "null"
          title: License
          description: The license this resource is associated with. The license is in the
            CURIE format `licenses-<provider>:<id>` (e.g.,
            `licenses-aaip:<uuid>`). The `provider` is the name of the license
            provider and the `id` is the identifier of the license.
        createdBy:
          type: string
          pattern: ^(users|applications|evaluator):([a-zA-Z0-9-]+)$
          title: Createdby
          description: The actor who created this evaluator
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: System-managed timestamp
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updatedat
          description: System-managed timestamp
        updatedBy:
          anyOf:
            - type: string
              pattern: ^(users|applications|evaluator):([a-zA-Z0-9-]+)$
              description: CURIE format identifier
            - type: "null"
          title: Updatedby
          description: The user CURIE who last updated the evaluator
        accountId:
          type: string
          title: Accountid
          description: The account ID associated with this evaluator
        version:
          type: integer
          title: Version
          description: Version number, auto-incremented on each update
      type: object
      required:
        - id
        - name
        - isSystemManaged
        - outputMetrics
        - createdBy
        - createdAt
        - accountId
        - version
      title: Evaluator
      description: >-
        An evaluator acts as an agent that can execute evaluation jobs.


        It has a rubric (metrics), execution configuration (model, permissions),

        and can be invoked against datasets.


        System vs User Evaluators:

        - System-managed evaluators (`is_system_managed: true`) are read-only
        templates

        - User evaluators can be created from scratch or cloned from system
        templates

        - Only user evaluators can be used for job creation


        Access Control: Similar to agents.yaml, evaluators have admins and users

        with role-based permissions.
      examples:
        - accountId: trimble-trimble-construction
          admins:
            - users:123456789
          createdAt: 2026-04-10T12:30:00Z
          createdBy: users:123456789
          description: Scores faithfulness, relevance, and safety of agent answers.
          executionConfig:
            modelId: gpt-4o
            retryConfig:
              backoffMultiplier: 2
              maxRetries: 3
            searchType: hybrid
            timeoutSeconds: 300
            topK: 10
          id: b1a2c3d4-5678-4abc-9def-112233445566
          isSystemManaged: false
          license: licenses-aaip:00581fef-acde-4f9a-8a25-e05f529e8cb5
          name: RAG Quality Judge
          outputMetrics:
            - metricName: faithfulness
              outputType: NUMERICAL
            - metricName: relevance
              outputType: NUMERICAL
            - metricName: safety
              outputType: BOOLEAN
          prompt: You are a strict evaluator. Score faithfulness, relevance, and safety.
          updatedAt: 2026-04-10T12:45:00Z
          updatedBy: users:123456789
          users:
            - accounts:qa-team
          version: 1
    EvaluatorClone:
      properties:
        name:
