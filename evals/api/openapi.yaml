        recordType:
          type: string
          const: QUERY
          title: Recordtype
          description: Record type discriminator (QUERY).
          default: QUERY
        query:
          anyOf:
            - type: string
            - type: "null"
          title: Query
          description: Updated search query string
      additionalProperties: false
      type: object
      title: QueryRecordUpdate
      description: Update payload for a ``QUERY`` record.
      examples:
        - query: refund policy for duplicate charges (v2)
          recordType: QUERY
    RecordCreateRequestApi:
      properties:
        records:
          items:
            oneOf:
              - $ref: "#/components/schemas/ConversationRecordCreate"
              - $ref: "#/components/schemas/QueryRecordCreate"
            discriminator:
              propertyName: recordType
              mapping:
                CONVERSATION: "#/components/schemas/ConversationRecordCreate"
                QUERY: "#/components/schemas/QueryRecordCreate"
          type: array
          minItems: 1
          title: Records
          description: List of records to create
      type: object
      required:
        - records
      title: RecordCreateRequestApi
      description: Request body for creating one or more records (API shape).
      examples:
        - records:
            - context:
                - description: plan_tier
                  value: pro
                - description: region
                  value: us-east
              expectedContext:
                - chunkId: kb-chunk-42
                  libraryId: 11111111-2222-3333-4444-555555555555
              expectedOutput: Refund has been initiated for the duplicate charge on 04/12.
              expectedTools:
                - inputParameters:
                    month: 2026-04
                  name: get_invoice
              messages:
                - content: Why was I charged twice this month?
                  role: user
                - content:
                    - text: "Here is my statement:"
                      type: text
                    - type: image
                      url: https://example.com/statements/april.png
                  role: user
              metadata:
                priority: p1
                tag: regression
              recordType: CONVERSATION
            - expectedContext:
                - chunkId: kb-chunk-42
                  libraryId: 11111111-2222-3333-4444-555555555555
              expectedOutput: Customers may request a refund within 30 days of the charge.
              metadata:
                tag: retrieval-regression
              query: refund policy for duplicate charges
              recordType: QUERY
    RecordEvaluation:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: "[Primary Key] Unique identifier for this evaluation"
        recordId:
          type: string
          format: uuid
          title: Recordid
          description: The dataset record that was evaluated
        datasetId:
          type: string
          format: uuid
          title: Datasetid
          description: The dataset this record belongs to
        sourceType:
          $ref: "#/components/schemas/EvaluationSourceType"
          description: Whether this evaluation was performed by an LLM or human
        evaluatorId:
          type: string
          format: uuid
          title: Evaluatorid
          description: The evaluator (agent) that performed or defined this evaluation
        evaluatorActor:
          anyOf:
            - type: string
              pattern: ^(users|applications|evaluator):([a-zA-Z0-9-]+)$
              description: CURIE format identifier
            - type: "null"
          title: Evaluatoractor
          description: The actor who performed the evaluation. Auto-populated from OAuth
            token for HUMAN evaluations. System-managed for LLM evaluations.
        jobId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Jobid
          description: "The evaluation job this evaluation is associated with. Context
            inherited from job: agent_id, agent_version, kb_library_versions,
            model_id. Links to GET /jobs/{job_id} for full job context."
        traceId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Traceid
          description: "Reference to the execution trace. For EVALUATE_AGENT jobs:
            agent_trace_id (from Agent Service). For EVALUATE_RETRIEVAL jobs:
            search_trace_id (from KB Service). The trace contains:
            actual_output, execution details, tool calls, timing."
        runId:
          anyOf:
            - type: string
            - type: "null"
          title: Runid
          description: The agent run identifier returned by Agent Service for
            EVALUATE_AGENT jobs. Identifies a single invocation of the agent for
            this record. None for EVALUATE_RETRIEVAL jobs.
        threadId:
          anyOf:
            - type: string
            - type: "null"
          title: Threadid
          description: The agent thread identifier returned by Agent Service for
            EVALUATE_AGENT jobs. Identifies the conversation thread the agent
            executed in. None for EVALUATE_RETRIEVAL jobs.
        messages:
          anyOf:
            - items:
                $ref: "#/components/schemas/Message"
              type: array
            - type: "null"
          title: Messages
          description: Snapshot of the conversation history that was evaluated.
            Auto-populated from the dataset record for CONVERSATION records
            (EVALUATE_AGENT jobs). None for QUERY records.
        query:
          anyOf:
            - type: string
            - type: "null"
          title: Query
          description: Snapshot of the search query that was evaluated. Auto-populated
            from the dataset record for QUERY records (EVALUATE_RETRIEVAL jobs).
            None for CONVERSATION records.
        agentId:
          anyOf:
            - type: string
            - type: "null"
          title: Agentid
          description: The agent that was evaluated. Auto-populated from job.
        agentVersion:
          anyOf:
            - type: integer
            - type: "null"
          title: Agentversion
          description: The version number of the agent that was evaluated. Auto-populated
            from job.
        kbLibraryVersions:
          anyOf:
            - additionalProperties:
                type: integer
              type: object
            - type: "null"
          title: Kblibraryversions
          description: Snapshot of KB library versions at evaluation time. Auto-populated
            from job. Map of library_id -> version_number.
        modelId:
          anyOf:
            - type: string
            - type: "null"
          title: Modelid
          description: The model used for evaluation. Auto-populated from job (from
            evaluator's execution_config).
        actualOutput:
          anyOf:
            - type: string
            - $ref: "#/components/schemas/MultiModalOutput"
            - $ref: "#/components/schemas/RetrievalResult"
            - type: "null"
          title: Actualoutput
          description: "The output that was evaluated. Auto-fetched from trace_id. For
            EVALUATE_AGENT jobs: Retrieved from agent trace. For
            EVALUATE_RETRIEVAL jobs: Retrieved from search trace."
        actualTools:
          anyOf:
            - items:
                $ref: "#/components/schemas/ActualToolCall"
              type: array
            - type: "null"
          title: Actualtools
          description: The actual tool calls made by the agent during evaluation. Each
            tool call includes the tool name, input parameters, and response.
        actualContext:
          anyOf:
            - items:
                $ref: "#/components/schemas/AgentRetrievalContext"
              type: array
            - type: "null"
          title: Actualcontext
          description: The actual chunks retrieved by the agent
        expectedOutput:
          anyOf:
            - type: string
            - $ref: "#/components/schemas/MultiModalOutput"
            - type: "null"
          title: Expectedoutput
          description: The ground-truth ideal final answer from the dataset record
        expectedContext:
          anyOf:
            - items:
                $ref: "#/components/schemas/ExpectedChunk"
              type: array
            - type: "null"
          title: Expectedcontext
          description: The ground-truth ideal KB chunks from the dataset record
        expectedTools:
          anyOf:
            - items:
                $ref: "#/components/schemas/ExpectedToolCall"
              type: array
            - type: "null"
          title: Expectedtools
          description: The ground-truth ideal tool calls from the dataset record
        scores:
          additionalProperties: true
          type: object
          title: Scores
          description: 'Map of metric_name to score value. Example: {"faithfulness": 0.95,
            "relevance": 0.88}'
        comment:
          anyOf:
            - type: string
            - type: "null"
          title: Comment
          description: (Optional) Comments or notes from the evaluator
        outcome:
          $ref: "#/components/schemas/JobOutcome"
          description: Outcome of the evaluation (PASSED/FAILED)
        error:
          anyOf:
            - $ref: "#/components/schemas/ClientError"
            - type: "null"
          description: Structured failure detail when `outcome=FAILED`. Normalizes errors
            raised by the agent, KB, or model SDK clients into a consistent
            shape. None on the success path.
        evaluatedAt:
          type: string
          format: date-time
          title: Evaluatedat
          description: Timestamp when this evaluation was performed
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: System-managed timestamp
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updatedat
          description: System-managed timestamp
        createdBy:
          type: string
          pattern: ^(users|applications|evaluator):([a-zA-Z0-9-]+)$
          title: Createdby
          description: The user CURIE who created the evaluation
        updatedBy:
          anyOf:
            - type: string
              pattern: ^(users|applications|evaluator):([a-zA-Z0-9-]+)$
              description: CURIE format identifier
            - type: "null"
          title: Updatedby
          description: The user CURIE who last updated the evaluation
        accountId:
          type: string
          title: Accountid
          description: The account ID associated with this evaluation
      type: object
      required:
        - id
        - recordId
        - datasetId
        - sourceType
        - evaluatorId
        - scores
        - outcome
        - evaluatedAt
        - createdAt
        - createdBy
        - accountId
      title: RecordEvaluation
      description: >-
        A single evaluation (human or LLM) for a specific record.


        Connection to Jobs: When an evaluator job executes, it creates
        individual

        RecordEvaluation entries for each record in the dataset. The `job_id`
        field

        links back to the job that created this evaluation.


        Context Tracking: Captures agent version, KB library versions, and model
        used

        to enable accurate comparison and regression testing.
      examples:
        - accountId: trimble-trimble-construction
          actualOutput: Refund has been initiated for the duplicate charge on 04/12.
          agentId: billing-support-agent
          agentVersion: 12
          comment: Answer is grounded and safe; slight relevance gap on follow-up.
          createdAt: 2026-04-10T12:30:00Z
          createdBy: users:123456789
          datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
          evaluatedAt: 2026-04-10T12:45:00Z
          evaluatorActor: users:123456789
          evaluatorId: b1a2c3d4-5678-4abc-9def-112233445566
          id: ab12cd34-ef56-7890-abcd-ef1234567890
          jobId: 7f6e5d4c-3b2a-1908-7f6e-5d4c3b2a1908
          kbLibraryVersions:
            11111111-2222-3333-4444-555555555555: 7
          messages:
            - content: Why was I charged twice this month?
              role: user
          modelId: gpt-4o
          outcome: PASSED
          recordId: 123e4567-e89b-12d3-a456-426614174000
          scores:
            faithfulness: 0.95
            relevance: 0.88
            safety: true
          sourceType: HUMAN
          traceId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
          updatedAt: 2026-04-10T12:45:00Z
    RecordEvaluationSubmit:
      properties:
        datasetId:
          type: string
          format: uuid
          title: Datasetid
          description: "[Required] The dataset this record belongs to"
        recordId:
          type: string
          format: uuid
          title: Recordid
          description: "[Required] The dataset record being evaluated"
        evaluatorId:
          type: string
          format: uuid
          title: Evaluatorid
          description: "[Required] The evaluator (rubric) to use for scoring. Should match
            the evaluator used by the job for consistency."
        jobId:
          type: string
          format: uuid
          title: Jobid
          description: "[Required] The job whose output is being reviewed. Auto-populates:
            agent_id, agent_version, kb_library_versions, model_id"
        traceId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Traceid
          description: "[Required] The execution trace ID. For EVALUATE_AGENT jobs:
            agent_trace_id from Agent Service. For EVALUATE_RETRIEVAL jobs:
            search_trace_id from KB Service. Auto-fetches: actual_output"
        scores:
          additionalProperties: true
          type: object
          title: Scores
          description: "[Required] Map of metric_name to score value. Must include all
            metrics defined in the evaluator's output_metrics. Example:
            {\"faithfulness\": 0.95, \"relevance\": 0.88, \"safety\": true}"
        comment:
          anyOf:
            - type: string
            - type: "null"
          title: Comment
          description: (Optional) Comments or notes about the evaluation. Recommended for
            explaining scores, especially when disagreeing with LLM evaluation.
        outcome:
          $ref: "#/components/schemas/JobOutcome"
          description: Outcome of the evaluation (PASSED/FAILED)
      type: object
      required:
        - datasetId
        - recordId
        - evaluatorId
        - jobId
        - scores
        - outcome
      title: RecordEvaluationSubmit
      description: |-
        Payload for submitting a new evaluation for a record.

        What you provide (6 fields):
        - dataset_id, record_id, evaluator_id, job_id, trace_id, scores

        What API auto-populates (9 fields):
        - evaluator_actor (from OAuth token)
        - agent_id, agent_version, kb_library_versions, model_id (from job)
        - actual_output (from trace)
        - source_type, evaluated_at, created_at (system-managed)
      examples:
        - comment: Answer is grounded and safe; slight relevance gap on follow-up.
          datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
          evaluatorId: b1a2c3d4-5678-4abc-9def-112233445566
          jobId: 7f6e5d4c-3b2a-1908-7f6e-5d4c3b2a1908
          outcome: PASSED
          recordId: 123e4567-e89b-12d3-a456-426614174000
          scores:
            faithfulness: 0.95
            relevance: 0.88
            safety: true
          traceId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    RetrievalResult:
      properties:
        query:
          type: string
          title: Query
          description: The query that was executed against KB Service
        retrievedChunks:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Retrievedchunks
          description: Array of retrieved chunks in ranked order
        retrievalParams:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Retrievalparams
          description: Parameters used for retrieval (top, score_threshold, libraries)
      type: object
      required:
        - query
        - retrievedChunks
      title: RetrievalResult
      description: |-
        Results from a KB Service retrieval query.

        Contains the chunks that were retrieved, with their ranking and scores.
    RetryConfig:
      properties:
        maxRetries:
          type: integer
          minimum: 0
          title: Maxretries
          description: Maximum number of retry attempts on transient failures
          default: 3
        backoffMultiplier:
          type: number
          minimum: 1
          title: Backoffmultiplier
          description: Multiplier for exponential backoff between retries
          default: 2
      type: object
      title: RetryConfig
      description: Retry configuration for handling transient failures during evaluation.
    RunContext:
      properties:
        description:
          type: string
          title: Description
          description: Unique description/key for the context item
        value:
          type: string
          title: Value
          description: String value for the context item
      type: object
      required:
        - description
        - value
      title: RunContext
      description: >-
        A single context item forwarded to the agent's `context` parameter.


        Mirrors the Trimble agent SDK's `Context` type: `description` and
        `value`

        are required, and additional arbitrary properties are allowed and
        preserved.
    SuccessCriterion:
      properties:
        metricName:
          type: string
          title: Metricname
          description: The metric key (e.g., faithfulness)
        function:
          type: string
          pattern: ^(avg|count|min|max|p50|p90|p95|p99)$
          title: Function
          description: Aggregation function
        operator:
          type: string
          pattern: ^(gte|lte|gt|lt|eq)$
          title: Operator
          description: Comparison operator
        threshold:
          type: number
          maximum: 1
          minimum: 0
          title: Threshold
          description: The value to compare against
        value:
          anyOf:
            - type: string
            - type: "null"
          title: Value
          description: The specific categorical value to filter on for a count function
      type: object
      required:
        - metricName
        - function
        - operator
        - threshold
      title: SuccessCriterion
      description: A rule that defines a pass/fail condition for a single metric.
    SummaryResult:
      properties:
        rule:
          $ref: "#/components/schemas/SuccessCriterion"
        statistic:
          anyOf:
            - type: number
            - additionalProperties:
                type: integer
              type: object
          title: Statistic
          description: The calculated statistic or categorical statistic
        outcome:
          type: string
          pattern: ^(PASSED|FAILED)$
          title: Outcome
          description: Pass/fail outcome
      type: object
      required:
        - rule
        - statistic
        - outcome
      title: SummaryResult
      description: The calculated result for a single success criterion.
    TextContentPart:
      properties:
        type:
          type: string
          const: text
          title: Type
          description: "Discriminator: 'text'"
          default: text
        text:
          type: string
          title: Text
          description: The text content
      additionalProperties: false
      type: object
      required:
        - text
      title: TextContentPart
      description: Plain text content part.
    TrimbleErrorPayload:
      properties:
        type:
          $ref: "#/components/schemas/ErrorType"
          description: Error type code
        title:
          type: string
          title: Title
          description: Error title
        status:
          type: integer
          title: Status
          description: HTTP status code
        detail:
          anyOf:
            - type: string
            - type: "null"
          title: Detail
          description: Detailed error message
      type: object
      required:
        - type
        - title
        - status
      title: TrimbleErrorPayload
      description: Trimble standard error payload model.
    UpdateDatasetRequest:
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: A new human-readable name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: A new description
        kbLibraryLinks:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Kblibrarylinks
          description: An updated array of KB Service library UUIDs
        admins:
          anyOf:
            - items:
                type: string
                pattern: ^trimble-employee:(true|false)$|^trimble-automation:(true|false)$|^(users|applications|accounts):(\*|[\w_.-]+)$
                description: Actor claims
              type: array
            - type: "null"
          title: Admins
          description: Updated list of admin claims
        users:
          anyOf:
            - items:
                type: string
                pattern: ^trimble-employee:(true|false)$|^trimble-automation:(true|false)$|^(users|applications|accounts):(\*|[\w_.-]+)$
                description: Actor claims
              type: array
            - type: "null"
          title: Users
          description: Updated list of user claims
      type: object
      title: UpdateDatasetRequest
      description: Model for updating a dataset.
      examples:
        - description: Adds new refund/chargeback scenarios.
          kbLibraryLinks:
            - 11111111-2222-3333-4444-555555555555
            - aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
          name: Billing Agent RAG Evals (v2)
    UpdateEvaluatorRequest:
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: A new human-readable name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: A new description
        prompt:
          anyOf:
            - type: string
            - type: "null"
          title: Prompt
          description: An updated LLM-as-a-Judge prompt
        outputMetrics:
          anyOf:
            - items:
                $ref: "#/components/schemas/OutputMetric"
              type: array
            - type: "null"
          title: Outputmetrics
          description: An updated list of metrics this evaluator produces
        admins:
          anyOf:
            - items:
                type: string
                pattern: ^trimble-employee:(true|false)$|^trimble-automation:(true|false)$|^(users|applications|accounts):(\*|[\w_.-]+)$
                description: Actor claims
              type: array
            - type: "null"
          title: Admins
          description: Updated list of admin claims
        users:
          anyOf:
            - items:
                type: string
                pattern: ^trimble-employee:(true|false)$|^trimble-automation:(true|false)$|^(users|applications|accounts):(\*|[\w_.-]+)$
                description: Actor claims
              type: array
            - type: "null"
          title: Users
          description: Updated list of user claims
        executionConfig:
          anyOf:
            - $ref: "#/components/schemas/EvaluatorExecutionConfig"
            - type: "null"
          description: Updated execution behavior configuration (model, timeout, retry)
      type: object
      title: UpdateEvaluatorRequest
      description: |-
        Payload for updating a user-owned evaluator.

        Only admins can update evaluators.
        Fails if `is_system_managed: true` (system evaluators are read-only).
      examples:
        - description: Updated rubric with tightened safety check.
          executionConfig:
            modelId: gpt-4o
            retryConfig:
              backoffMultiplier: 2
              maxRetries: 3
            searchType: hybrid
            timeoutSeconds: 180
            topK: 10
    VideoContentPart:
      properties:
        type:
          type: string
          const: video
          title: Type
          description: "Discriminator: 'video'"
          default: video
        url:
          type: string
          title: Url
          description: URL of the video asset
      additionalProperties: false
      type: object
      required:
        - url
      title: VideoContentPart
      description: Video content part referenced by URL.
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            evals: Use evaluation service.
          tokenUrl: https://id.trimble.com/oauth/token
        authorizationCode:
          scopes:
            openid: Get user identity.
            evals: Use evaluation service.
          authorizationUrl: https://id.trimble.com/oauth/authorize
          tokenUrl: https://id.trimble.com/oauth/token
tags:
  - name: Datasets
    description: Endpoints for managing datasets and their records. Datasets serve
      as containers grouping related test cases, while dataset records represent
      individual test cases withinput data, expected outputs, and ground truth
      for evaluation.
  - name: Evaluation Jobs
    description: Endpoints for managing evaluation jobs (top-level resource). Jobs
      execute evaluators against datasets asynchronously, creating
      RecordEvaluation entries for each record.
  - name: Evaluation Results
    description: Endpoints for managing evaluation results with flexible filtering
      by dataset, record, job, agent, evaluator, and actor. Stores both human
      and LLM evaluations. Enables cross-dataset analysis and inter-rater
      reliability comparisons.
  - name: Evaluators
    description: Endpoints for managing evaluator agents (rubrics, permissions, and
      execution configuration).
