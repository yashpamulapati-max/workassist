components:
  schemas:
    ActualToolCall:
      properties:
        name:
          type: string
          title: Name
          description: The name of the tool that was called
        inputParameters:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Inputparameters
          description: The actual input parameters passed to the tool
        response:
          anyOf:
            - additionalProperties: true
              type: object
            - items: {}
              type: array
            - type: "null"
          title: Response
          description: The actual response returned by the tool. Can be a single object or
            a list of results.
        timestamp:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Timestamp
          description: When the tool was called
      type: object
      required:
        - name
      title: ActualToolCall
      description: Represents an actual tool call that occurred during a reference run.
    AgentInfo:
      properties:
        id:
          type: string
          title: Id
          description: Agent ID
        name:
          type: string
          title: Name
          description: Agent name
        version:
          anyOf:
            - type: integer
            - type: "null"
          title: Version
          description: Agent version
      type: object
      required:
        - id
        - name
      title: AgentInfo
      description: Nested agent information in job response.
    AgentRetrievalContext:
      properties:
        query:
          type: string
          title: Query
          description: The search query sent to the knowledge base
        results:
          type: string
          title: Results
          description: The raw text content returned by the knowledge base
        libraryIds:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Libraryids
          description: Which KB libraries were searched
        searchType:
          anyOf:
            - type: string
            - type: "null"
          title: Searchtype
          description: The search type used (semantic, hybrid, etc.)
      type: object
      required:
        - query
        - results
      title: AgentRetrievalContext
      description: >-
        Retrieval context captured from agent stream search_knowledge_base tool
        calls.


        Unlike RetrievalResult (used for EVALUATE_RETRIEVAL with structured
        chunks),

        this captures the raw KB content as returned in the agent response
        stream.
    AudioContentPart:
      properties:
        type:
          type: string
          const: audio
          title: Type
          description: "Discriminator: 'audio'"
          default: audio
        url:
          type: string
          title: Url
          description: URL of the audio asset
      additionalProperties: false
      type: object
      required:
        - url
      title: AudioContentPart
      description: Audio content part referenced by URL.
    ClientError:
      properties:
        statusCode:
          anyOf:
            - type: integer
            - type: "null"
          title: Statuscode
          description: HTTP status code from the upstream response, when known.
        errorType:
          anyOf:
            - type: string
            - type: "null"
          title: Errortype
          description: Machine-readable Trimble error tag (e.g. `tag:BadRequest`) when the
            upstream payload provided one.
        title:
          anyOf:
            - type: string
            - type: "null"
          title: Title
          description: Short error title from the upstream payload, when known.
        detail:
          type: string
          title: Detail
          description: Human-readable detail. Falls back to `str(exception)`.
        source:
          $ref: "#/components/schemas/ClientErrorSource"
          description: Subservice that produced the error (agent/kb/model/unknown).
      type: object
      required:
        - detail
        - source
      title: ClientError
      description: |-
        Structured representation of a client-side failure.

        Bundles the HTTP status code (when known), the Trimble error tag
        (`error_type`), title, and human-readable detail along with the
        originating subservice. Constructed via `from_exception` from any
        exception raised inside the worker's evaluation path.
    ClientErrorSource:
      type: string
      enum:
        - agent
        - kb
        - model
        - unknown
      title: ClientErrorSource
      description: Origin subservice that raised the underlying SDK exception.
    ContentPart:
      properties:
        type:
          type: string
          pattern: ^(text|image|audio|video|file)$
          title: Type
          description: The type of content in this part
        text:
          anyOf:
            - type: string
            - type: "null"
          title: Text
          description: "(For type: text) The text content"
        imageUrl:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Imageurl
          description: "(For type: image) Image reference with url and optional detail"
        audioUrl:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Audiourl
          description: "(For type: audio) Audio reference with url, format, duration"
        videoUrl:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Videourl
          description: "(For type: video) Video reference with url, format, duration"
        fileId:
          anyOf:
            - type: string
            - type: "null"
          title: Fileid
          description: "(For type: file) File ID from file upload system"
      type: object
      required:
        - type
      title: ContentPart
      description: A single part of multi-modal message content.
    ConversationRecord:
      properties:
