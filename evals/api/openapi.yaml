    post:
      tags:
        - Evaluation Jobs
      summary: Create job
      description: "Creates a new job (evaluation or generation). Optional `context`
        (`EVALUATE_AGENT`) and `executionConfig` (`EVALUATE_AGENT` and
        `EVALUATE_RETRIEVAL`) override the evaluator's defaults; the resolved
        config is returned in the response. Returns 202 Accepted with initial
        job object (status: PENDING)."
      operationId: create_job_v1_jobs_post
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/EvaluateAgentJobCreate"
                - $ref: "#/components/schemas/EvaluateRetrievalJobCreate"
                - $ref: "#/components/schemas/GenerateRecordsJobCreate"
              title: Job Request
            examples:
              evaluateAgent:
                summary: EVALUATE_AGENT — regress an agent version
                description: Run a user-owned evaluator over an agent+dataset with success
                  criteria that gate the outcome.
                value:
                  type: EVALUATE_AGENT
                  name: Nightly billing-agent regression
                  description: Runs the RAG quality judge over the billing regression set.
                  datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
                  assignee:
                    actors:
                      - evaluator:b1a2c3d4-5678-4abc-9def-112233445566
                  agentId: billing-support-agent
                  agentVersion: 12
                  successCriteria:
                    - metricName: faithfulness
                      function: avg
                      operator: gte
                      threshold: 0.85
                    - metricName: relevance
                      function: p95
                      operator: gte
                      threshold: 0.8
                  context:
                    - description: modelId
                      value: gpt-4o
                  executionConfig:
                    type: EVALUATE_AGENT
                    modelId: gemini-2.5-flash
                    timeoutSeconds: 300
                    retryConfig:
                      maxRetries: 3
                      backoffMultiplier: 2
                  license: licenses-aaip:00581fef-acde-4f9a-8a25-e05f529e8cb5
              evaluateAgentWithModelOverride:
                summary: EVALUATE_AGENT — context + executionConfig overrides
                description: Job-level context sets the agent modelId; executionConfig overrides
                  the evaluator judge modelId without cloning the evaluator.
                value:
                  type: EVALUATE_AGENT
                  name: A/B judge model comparison
                  description: Same dataset and evaluator; overrides agent modelId via context and
                    judge modelId via executionConfig.
                  datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
                  assignee:
                    actors:
                      - evaluator:b1a2c3d4-5678-4abc-9def-112233445566
                  agentId: billing-support-agent
                  agentVersion: 12
                  successCriteria:
                    - metricName: faithfulness
                      function: avg
                      operator: gte
                      threshold: 0.85
                    - metricName: relevance
                      function: p95
                      operator: gte
                      threshold: 0.8
                  context:
                    - description: modelId
                      value: gpt-4o
                  executionConfig:
                    type: EVALUATE_AGENT
                    modelId: gemini-2.5-flash
                    timeoutSeconds: 300
                  license: licenses-aaip:00581fef-acde-4f9a-8a25-e05f529e8cb5
              evaluateRetrieval:
                summary: EVALUATE_RETRIEVAL — score KB retrieval quality
                description: Evaluate retrieval recall/precision against the dataset.
                value:
                  type: EVALUATE_RETRIEVAL
                  name: KB retrieval regression
                  datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
                  assignee:
                    actors:
                      - evaluator:b1a2c3d4-5678-4abc-9def-112233445566
                  successCriteria:
                    - metricName: contextRecall
                      function: avg
                      operator: gte
                      threshold: 0.8
                  executionConfig:
                    type: EVALUATE_RETRIEVAL
                    modelId: gpt-4o
                    timeoutSeconds: 300
                    searchType: semantic
                    topK: 20
                    scoreThreshold: 0.7
                  license: licenses-aaip:00581fef-acde-4f9a-8a25-e05f529e8cb5
              evaluateRetrievalWithExecutionConfig:
                summary: EVALUATE_RETRIEVAL — override searchType and topK
                description: Vary retrieval parameters per job via executionConfig without
                  cloning the evaluator.
                value:
                  type: EVALUATE_RETRIEVAL
                  name: Semantic retrieval sweep (topK=20)
                  description: Overrides retrieval search params without cloning the evaluator.
                  datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
                  assignee:
                    actors:
                      - evaluator:b1a2c3d4-5678-4abc-9def-112233445566
                  successCriteria:
                    - metricName: contextRecall
                      function: avg
                      operator: gte
                      threshold: 0.8
                  executionConfig:
                    type: EVALUATE_RETRIEVAL
                    searchType: semantic
                    topK: 20
                    scoreThreshold: 0.7
                  license: licenses-aaip:00581fef-acde-4f9a-8a25-e05f529e8cb5
              generateRecords:
                summary: GENERATE_RECORDS — synthesize new dataset records
                description: Use an LLM curator to synthesize new records into the dataset.
                value:
                  type: GENERATE_RECORDS
                  name: Synthesize 200 new billing records
                  datasetId: 9a8b7c6d-1234-4abc-9def-0123456789ab
